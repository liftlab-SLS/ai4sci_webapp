<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pipeline Explorer — Contributions</title>
<style>
  :root {
    --ground: #F7F5F0;
    --panel: #FFFFFF;
    --text: #1C2231;
    --muted: #6B7180;
    --faint: #9AA0AC;
    --line: #E3DFD6;
    --line-strong: #D2CCBF;
    --accent: #2F4B7C;
    --accent-soft: #EAEFF6;
    --accent-2: #A8843E;
    --accent-2-soft: #F4ECD9;
    --danger: #A23B3B;
    --chrome: #1C2231;
    --chrome-text: #EDEBE4;
    --serif: Georgia, "Times New Roman", serif;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --mono: "SF Mono", ui-monospace, Menlo, Consolas, monospace;
    --shadow: 0 1px 2px rgba(28,34,49,.04), 0 4px 16px rgba(28,34,49,.05);
    --radius: 8px;
    --sidebar-width: 310px;

    --f-primary: #2F4B7C;
    --f-secondary: #5A7BAA;
    --f-incidental: #9AA0AC;
    --s-supports: #2E7D52;
    --s-rejects: #A23B3B;
    --s-qualifies: #A8843E;
    --s-explains: #6B4A9B;
    --s-compares: #2E7D7A;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: var(--sans);
    color: var(--text);
    background: var(--ground);
    font-size: 14px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  h1, h2, h3, h4 { font-family: var(--serif); font-weight: 600; margin: 0; letter-spacing: -.01em; }
  button { font-family: inherit; cursor: pointer; border: none; background: none; }

  /* ── topbar ──────────────────────────────────── */
  .topbar {
    display: flex; align-items: center; gap: 16px;
    background: var(--chrome); color: var(--chrome-text);
    padding: 14px 24px; border-bottom: 3px solid var(--accent-2);
    flex: 0 0 auto;
  }
  .topbar .mark { font-family: var(--serif); font-size: 20px; font-weight: 600; letter-spacing: -.015em; white-space: nowrap; }
  .topbar .mark .dot { color: var(--accent-2); }
  .topbar .tagline { font-size: 12px; color: #A7ABB6; border-left: 1px solid #3A4256; padding-left: 16px; letter-spacing: .02em; }
  .topbar-controls { display: flex; align-items: center; gap: 8px; }
  .topbar-controls label { font-size: 11px; color: #A7ABB6; white-space: nowrap; }
  .topbar-controls select {
    background: #2A3247; color: var(--chrome-text);
    border: 1px solid #3A4256; border-radius: 5px;
    padding: 4px 8px; font-size: 12px; font-family: var(--sans);
    cursor: pointer; outline: none;
  }
  .topbar-controls select:focus { border-color: var(--accent-2); }
  .topbar .proto-link {
    margin-left: 4px; white-space: nowrap; font-size: 12.5px; color: #C7CAD3;
    text-decoration: none; border: 1px solid #3A4256; border-radius: 7px;
    padding: 6px 11px; transition: all .12s;
  }
  .topbar .proto-link:first-of-type { margin-left: auto; }
  .topbar .proto-link:hover { color: #fff; border-color: var(--accent-2); background: rgba(168,132,62,.12); }

  /* ── shell ───────────────────────────────────── */
  .shell { flex: 1 1 auto; display: flex; min-height: 0; }

  /* ── sidebar ─────────────────────────────────── */
  .sidebar {
    flex: 0 0 var(--sidebar-width); width: var(--sidebar-width);
    background: var(--panel); border-right: 1px solid var(--line);
    display: flex; flex-direction: column; min-height: 0;
  }
  .sidebar-head {
    padding: 12px 14px 10px;
    border-bottom: 1px solid var(--line);
    flex: 0 0 auto;
  }
  .sidebar-head h2 { font-size: 13px; color: var(--muted); margin-bottom: 8px; }
  .search-input {
    width: 100%; padding: 6px 10px; font-size: 13px;
    border: 1px solid var(--line-strong); border-radius: 6px;
    background: var(--ground); color: var(--text); outline: none;
    font-family: var(--sans);
  }
  .search-input:focus { border-color: var(--accent); }
  .paper-list { flex: 1; overflow-y: auto; }
  .paper-item {
    padding: 9px 14px;
    border-bottom: 1px solid var(--line);
    cursor: pointer;
    transition: background .1s;
  }
  .paper-item:hover { background: var(--ground); }
  .paper-item.active { background: var(--accent-soft); border-left: 3px solid var(--accent); padding-left: 11px; }
  .paper-item-title {
    font-size: 12.5px; font-weight: 500; line-height: 1.35;
    color: var(--text); margin-bottom: 3px;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .paper-item.active .paper-item-title { color: var(--accent); }
  .paper-item-meta { font-size: 11px; color: var(--muted); display: flex; gap: 8px; align-items: center; }
  .match-count {
    font-family: var(--mono); font-size: 10px; font-weight: 500;
    background: var(--accent-2-soft); color: var(--accent-2);
    border-radius: 3px; padding: 1px 5px;
  }
  .paper-item.active .match-count { background: var(--accent-soft); color: var(--accent); }

  /* ── main panel ─────────────────────────────── */
  .main-panel { flex: 1; display: flex; flex-direction: column; min-width: 0; min-height: 0; }

  .paper-header {
    background: var(--panel); border-bottom: 1px solid var(--line);
    padding: 14px 20px 12px; flex: 0 0 auto;
  }
  .paper-header h1 { font-size: 16px; line-height: 1.35; margin-bottom: 6px; color: var(--text); }
  .paper-header-meta { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .chip {
    font-size: 11px; font-family: var(--mono); padding: 2px 7px;
    border-radius: 4px; border: 1px solid var(--line-strong); color: var(--muted);
    background: var(--ground);
  }
  .chip.hl { color: var(--accent-2); border-color: rgba(168,132,62,.4); background: var(--accent-2-soft); }

  .abstract-toggle {
    font-size: 11.5px; color: var(--accent); cursor: pointer; background: none;
    border: none; padding: 0; text-decoration: underline; text-underline-offset: 2px;
    font-family: var(--sans);
  }
  .abstract-body {
    font-size: 12.5px; color: var(--muted); line-height: 1.65;
    margin-top: 10px; display: none;
    max-height: 180px; overflow-y: auto;
    padding-right: 4px;
  }
  .abstract-body.open { display: block; }

  /* filter bar */
  .filter-bar {
    background: var(--ground); border-bottom: 1px solid var(--line);
    padding: 8px 20px; display: flex; gap: 6px; flex: 0 0 auto; flex-wrap: wrap;
  }
  .filter-pill {
    font-size: 11.5px; padding: 3px 10px; border-radius: 20px;
    border: 1px solid var(--line-strong); color: var(--muted);
    background: var(--panel); transition: all .1s; cursor: pointer;
  }
  .filter-pill:hover { border-color: var(--accent); color: var(--accent); }
  .filter-pill.active { background: var(--accent); color: #fff; border-color: var(--accent); }

  /* theme cards */
  .theme-scroll { flex: 1; overflow-y: auto; padding: 12px 16px; display: flex; flex-direction: column; gap: 8px; }

  .theme-card {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: var(--radius); overflow: hidden;
    box-shadow: var(--shadow); flex-shrink: 0;
  }
  .theme-card-header {
    padding: 10px 14px; display: flex; align-items: flex-start; gap: 10px;
    cursor: pointer; transition: background .1s;
  }
  .theme-card-header:hover { background: var(--ground); }
  .theme-card.open .theme-card-header { background: var(--ground); border-bottom: 1px solid var(--line); }

  .theme-idx-badge {
    font-family: var(--mono); font-size: 10px; color: var(--faint);
    padding: 2px 5px; border: 1px solid var(--line); border-radius: 3px;
    flex-shrink: 0; margin-top: 1px;
  }
  .theme-name { font-size: 13px; font-family: var(--serif); line-height: 1.4; flex: 1; }
  .badge-row { display: flex; gap: 4px; align-items: center; flex-shrink: 0; flex-wrap: wrap; }

  .focus-badge, .stance-badge {
    font-size: 10px; font-family: var(--mono); border-radius: 3px;
    padding: 2px 6px; font-weight: 500; white-space: nowrap;
  }
  .focus-primary   { background: rgba(47,75,124,.1);  color: var(--f-primary); }
  .focus-secondary { background: rgba(90,123,170,.1); color: var(--f-secondary); }
  .focus-incidental{ background: rgba(154,160,172,.1);color: var(--f-incidental); }
  .stance-supports  { background: rgba(46,125,82,.1);  color: var(--s-supports); }
  .stance-rejects   { background: rgba(162,59,59,.1);  color: var(--s-rejects); }
  .stance-qualifies { background: rgba(168,132,62,.1); color: var(--s-qualifies); }
  .stance-explains  { background: rgba(107,74,155,.1); color: var(--s-explains); }
  .stance-compares  { background: rgba(46,125,122,.1); color: var(--s-compares); }

  .freq-badge { font-size: 10px; font-family: var(--mono); color: var(--faint); }
  .chevron { font-size: 10px; color: var(--faint); transition: transform .18s; flex-shrink: 0; margin-top: 2px; }
  .theme-card.open .chevron { transform: rotate(180deg); }

  .theme-card-body { padding: 12px 14px; display: none; }
  .theme-card.open .theme-card-body { display: block; }

  .theme-def {
    font-size: 12px; color: var(--muted); font-style: italic;
    line-height: 1.55; margin-bottom: 12px;
    padding-bottom: 10px; border-bottom: 1px solid var(--line);
  }
  .contrib-grid { display: flex; flex-direction: column; gap: 10px; }
  .contrib-field {}
  .contrib-label {
    font-family: var(--mono); font-size: 9.5px; text-transform: uppercase;
    letter-spacing: .08em; color: var(--accent-2); margin-bottom: 3px;
  }
  .contrib-text { font-size: 13px; line-height: 1.6; color: var(--text); }

  /* empty / loading states */
  .empty-state {
    padding: 60px 20px; text-align: center; color: var(--muted);
    font-size: 14px;
  }
  .empty-state strong { display: block; font-size: 16px; color: var(--text); margin-bottom: 6px; }

  .no-paper {
    flex: 1; display: flex; align-items: center; justify-content: center;
    color: var(--muted); font-size: 14px;
  }

  ::-webkit-scrollbar { width: 5px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--line-strong); border-radius: 3px; }

  @media (prefers-reduced-motion: reduce) {
    .chevron { transition: none; }
  }
</style>
</head>
<body>

<header class="topbar">
  <span class="mark">Pipeline Explorer<span class="dot">.</span></span>
  <span class="tagline">Debates in legal scholarship, from abstract to consensus</span>
  <div class="topbar-controls">
    <label for="run-select">Run</label>
    <select id="run-select"></select>
  </div>
  <a class="proto-link" href="../">← Explorer</a>
</header>

<div class="shell">
  <aside class="sidebar">
    <div class="sidebar-head">
      <h2 id="sidebar-heading">Papers</h2>
      <input class="search-input" id="paper-search" type="search" placeholder="Search papers…" autocomplete="off">
    </div>
    <div class="paper-list" id="paper-list"></div>
  </aside>

  <div class="main-panel" id="main-panel">
    <div class="no-paper" id="no-paper">Select a paper to view its contributions.</div>
    <div id="paper-view" style="display:none;flex:1;display:none;flex-direction:column;min-height:0;">
      <div class="paper-header" id="paper-header"></div>
      <div class="filter-bar" id="filter-bar"></div>
      <div class="theme-scroll" id="theme-scroll"></div>
    </div>
  </div>
</div>

<script>
const CONTRIB_BASE = '../data/contributions';

let allData = null;     // full run JSON
let allRuns = null;     // runs manifest
let currentPaper = null;
let filterFocus = 'all';
let communityId = 'community_177';
let step = 'step2';

// ── query param support ────────────────────────────────────────────────────
const params = new URLSearchParams(location.search);
if (params.get('community')) communityId = params.get('community');
if (params.get('step')) step = params.get('step');

// ── helpers ────────────────────────────────────────────────────────────────
function esc(s) {
  return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function focusBadge(f) {
  if (!f || f.toUpperCase() === 'NONE') return '';
  return `<span class="focus-badge focus-${f.toLowerCase()}">${esc(f)}</span>`;
}

function stanceBadge(s) {
  if (!s || s.toUpperCase() === 'NONE') return '';
  return `<span class="stance-badge stance-${s.toLowerCase()}">${esc(s)}</span>`;
}

function shortTitle(title) {
  return title.replace(/^ARTICLE:\s*/i,'').replace(/^Article:\s*/i,'');
}

// ── run selector ───────────────────────────────────────────────────────────
async function loadManifest() {
  const url = `${CONTRIB_BASE}/${communityId}_${step}_runs.json`;
  const r = await fetch(url, { cache: 'no-cache' });
  if (!r.ok) throw new Error('Could not load runs manifest');
  return r.json();
}

async function loadRun(hash) {
  const url = hash
    ? `${CONTRIB_BASE}/${communityId}_${step}_${hash}.json`
    : `${CONTRIB_BASE}/${communityId}_${step}.json`;
  const r = await fetch(url, { cache: 'no-cache' });
  if (!r.ok) throw new Error('Could not load run data');
  return r.json();
}

function buildRunSelect(runs) {
  const sel = document.getElementById('run-select');
  sel.innerHTML = '';
  [...runs].reverse().forEach(run => {
    const opt = document.createElement('option');
    opt.value = run.run_hash;
    opt.textContent = `${run.version_label} — ${run.n_papers}p / ${run.n_matches}m (${run.run_hash.slice(0,6)})`;
    sel.appendChild(opt);
  });
  sel.value = runs[runs.length - 1].run_hash;
}

// ── paper list ─────────────────────────────────────────────────────────────
function renderPaperList(papers, query = '') {
  const list = document.getElementById('paper-list');
  const q = query.trim().toLowerCase();
  const filtered = q ? papers.filter(p => shortTitle(p.title).toLowerCase().includes(q) || (p.authors || '').toLowerCase().includes(q)) : papers;

  document.getElementById('sidebar-heading').textContent =
    `${filtered.length} paper${filtered.length !== 1 ? 's' : ''}`;

  if (!filtered.length) {
    list.innerHTML = '<div class="empty-state">No papers match.</div>';
    return;
  }

  list.innerHTML = filtered.map(p => {
    const active = currentPaper && currentPaper.node_id === p.node_id ? ' active' : '';
    return `<div class="paper-item${active}" data-id="${esc(p.node_id)}">
      <div class="paper-item-title">${esc(shortTitle(p.title))}</div>
      <div class="paper-item-meta">
        <span class="match-count">${p.n_matches} matched</span>
        ${p.authors ? `<span>${esc(p.authors.split(';')[0].trim())}${p.authors.includes(';') ? ' et al.' : ''}</span>` : ''}
        ${p.date ? `<span>${p.date.slice(0,4)}</span>` : ''}
      </div>
    </div>`;
  }).join('');

  list.querySelectorAll('.paper-item').forEach(el => {
    el.addEventListener('click', () => {
      const paper = allData.papers.find(p => p.node_id === el.dataset.id);
      if (paper) selectPaper(paper);
    });
  });
}

// ── paper view ─────────────────────────────────────────────────────────────
function selectPaper(paper) {
  currentPaper = paper;
  filterFocus = 'all';

  // update sidebar highlight
  document.querySelectorAll('.paper-item').forEach(el => {
    el.classList.toggle('active', el.dataset.id === paper.node_id);
  });

  document.getElementById('no-paper').style.display = 'none';
  const view = document.getElementById('paper-view');
  view.style.display = 'flex';
  view.style.flexDirection = 'column';
  view.style.minHeight = '0';
  view.style.flex = '1';

  renderPaperHeader(paper);
  renderFilterBar(paper);
  renderThemes(paper);
}

function renderPaperHeader(paper) {
  const el = document.getElementById('paper-header');
  const fcKeys = Object.keys(paper.focus_counts || {}).sort((a,b) => (paper.focus_counts[b] - paper.focus_counts[a]));
  const scKeys = Object.keys(paper.stance_counts || {}).sort((a,b) => (paper.stance_counts[b] - paper.stance_counts[a]));

  el.innerHTML = `
    <h1>${esc(shortTitle(paper.title))}</h1>
    <div class="paper-header-meta">
      <span class="chip hl">${paper.n_matches} matched themes</span>
      ${paper.authors ? `<span class="chip">${esc(paper.authors.split(';')[0].trim())}${paper.authors.includes(';') ? ' et al.' : ''}</span>` : ''}
      ${paper.date ? `<span class="chip">${paper.date.slice(0,4)}</span>` : ''}
      ${fcKeys.slice(0,3).map(f => `<span class="chip">${focusBadge(f)} ×${paper.focus_counts[f]}</span>`).join('')}
      ${scKeys.slice(0,3).map(s => `<span class="chip">${stanceBadge(s)} ×${paper.stance_counts[s]}</span>`).join('')}
      ${paper.abstract ? `<button class="abstract-toggle" id="abs-toggle">Show abstract</button>` : ''}
    </div>
    ${paper.abstract ? `<div class="abstract-body" id="abs-body">${esc(paper.abstract)}</div>` : ''}
  `;

  const btn = el.querySelector('#abs-toggle');
  const body = el.querySelector('#abs-body');
  if (btn && body) {
    btn.addEventListener('click', () => {
      const open = body.classList.toggle('open');
      btn.textContent = open ? 'Hide abstract' : 'Show abstract';
    });
  }
}

function renderFilterBar(paper) {
  const bar = document.getElementById('filter-bar');
  const focusValues = [...new Set(paper.matches.map(m => m.focus).filter(Boolean))].sort();

  bar.innerHTML = `
    <button class="filter-pill${filterFocus === 'all' ? ' active' : ''}" data-focus="all">All ${paper.n_matches}</button>
    ${focusValues.map(f => {
      const count = paper.matches.filter(m => m.focus === f).length;
      return `<button class="filter-pill${filterFocus === f ? ' active' : ''}" data-focus="${esc(f)}">${esc(f)} <span style="opacity:.6">×${count}</span></button>`;
    }).join('')}
  `;

  bar.querySelectorAll('.filter-pill').forEach(btn => {
    btn.addEventListener('click', () => {
      filterFocus = btn.dataset.focus;
      bar.querySelectorAll('.filter-pill').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderThemes(paper);
    });
  });
}

function renderThemes(paper) {
  const scroll = document.getElementById('theme-scroll');
  const matches = filterFocus === 'all'
    ? paper.matches
    : paper.matches.filter(m => m.focus === filterFocus);

  if (!matches.length) {
    scroll.innerHTML = '<div class="empty-state"><strong>No matches</strong>Try a different filter.</div>';
    return;
  }

  const schemaV = allData.schema_version || 'v1';

  scroll.innerHTML = matches.map(m => {
    const fb = focusBadge(m.focus);
    const sb = stanceBadge(m.stance);
    const hasDetail = m.specific_contribution || m.contribution || m.generalized_contribution;
    return `<div class="theme-card" data-idx="${m.theme_idx_global}">
      <div class="theme-card-header">
        <span class="theme-idx-badge">${String(m.theme_idx_global).padStart(3,'0')}</span>
        <span class="theme-name">${esc(m.theme_name)}</span>
        <div class="badge-row">
          ${fb}${sb}
          <span class="freq-badge">×${m.theme_frequency}</span>
          ${hasDetail ? '<span class="chevron">▾</span>' : ''}
        </div>
      </div>
      ${hasDetail ? `<div class="theme-card-body">
        ${m.theme_definition ? `<div class="theme-def">${esc(m.theme_definition)}</div>` : ''}
        <div class="contrib-grid">
          ${(m.specific_contribution || m.contribution) ? `
            <div class="contrib-field">
              <div class="contrib-label">${schemaV === 'v1' ? 'Contribution' : 'Specific'}</div>
              <div class="contrib-text">${esc(m.specific_contribution || m.contribution)}</div>
            </div>` : ''}
          ${m.generalized_contribution ? `
            <div class="contrib-field">
              <div class="contrib-label">Generalized</div>
              <div class="contrib-text">${esc(m.generalized_contribution)}</div>
            </div>` : ''}
        </div>
      </div>` : ''}
    </div>`;
  }).join('');

  scroll.querySelectorAll('.theme-card').forEach(card => {
    const header = card.querySelector('.theme-card-header');
    const body = card.querySelector('.theme-card-body');
    if (!body) return;
    header.addEventListener('click', () => {
      const wasOpen = card.classList.contains('open');
      scroll.querySelectorAll('.theme-card.open').forEach(c => c.classList.remove('open'));
      if (!wasOpen) card.classList.add('open');
    });
  });
}

// ── init ───────────────────────────────────────────────────────────────────
async function init() {
  try {
    allRuns = await loadManifest();
    buildRunSelect(allRuns.runs);

    const hash = allRuns.latest_run_hash;
    allData = await loadRun(hash);

    renderPaperList(allData.papers);

    // auto-select first paper
    if (allData.papers.length) selectPaper(allData.papers[0]);

  } catch (err) {
    document.getElementById('main-panel').innerHTML =
      `<div class="empty-state"><strong>Could not load data</strong>${err.message}</div>`;
  }
}

document.getElementById('run-select').addEventListener('change', async e => {
  const hash = e.target.value;
  allData = await loadRun(hash);
  currentPaper = null;
  document.getElementById('paper-view').style.display = 'none';
  document.getElementById('no-paper').style.display = '';
  renderPaperList(allData.papers);
});

document.getElementById('paper-search').addEventListener('input', e => {
  renderPaperList(allData.papers, e.target.value);
});

init();
</script>
</body>
</html>
