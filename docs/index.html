<title>Pipeline Explorer</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    --ground: #F7F5F0;
    --panel: #FFFFFF;
    --text: #1C2231;
    --muted: #6B7180;
    --faint: #9AA0AC;
    --line: #E3DFD6;
    --line-strong: #D2CCBF;
    --accent: #2F4B7C;
    --accent-soft: #EAEFF6;
    --accent-2: #A8843E;
    --accent-2-soft: #F4ECD9;
    --chrome: #1C2231;
    --chrome-text: #EDEBE4;
    --danger: #A23B3B;
    --serif: Georgia, "Times New Roman", "Iowan Old Style", serif;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --mono: "SF Mono", "SFMono-Regular", ui-monospace, "Cascadia Mono", Menlo, Consolas, monospace;
    --shadow: 0 1px 2px rgba(28,34,49,.04), 0 4px 16px rgba(28,34,49,.05);
    --radius: 10px;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: var(--sans);
    color: var(--text);
    background: var(--ground);
    font-size: 15px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  h1, h2, h3, h4 { font-family: var(--serif); font-weight: 600; margin: 0; letter-spacing: -.01em; }
  a { color: var(--accent); }
  button { font-family: inherit; }

  /* ---- Header ---- */
  .topbar {
    display: flex; align-items: center; gap: 16px;
    background: var(--chrome); color: var(--chrome-text);
    padding: 14px 24px; border-bottom: 3px solid var(--accent-2);
  }
  .topbar .mark {
    font-family: var(--serif); font-size: 20px; font-weight: 600;
    letter-spacing: -.015em; white-space: nowrap;
  }
  .topbar .mark .dot { color: var(--accent-2); }
  .topbar .tagline {
    font-size: 12px; color: #A7ABB6; border-left: 1px solid #3A4256;
    padding-left: 16px; letter-spacing: .02em;
  }
  .topbar .proto-link {
    margin-left: auto; white-space: nowrap; font-size: 12.5px; color: #C7CAD3;
    text-decoration: none; border: 1px solid #3A4256; border-radius: 7px;
    padding: 6px 11px; transition: all .12s;
  }
  .topbar .proto-link:hover { color: #fff; border-color: var(--accent-2); background: rgba(168,132,62,.12); }
  .topbar .cur {
    margin-left: 20px; text-align: right; font-size: 13px; color: #C7CAD3;
    max-width: 38vw; overflow: hidden;
  }
  .topbar .cur .lbl { color: #7C818F; font-size: 11px; text-transform: uppercase; letter-spacing: .08em; }
  .topbar .cur .val {
    font-family: var(--serif); font-size: 16px; color: #fff;
    display: flex; align-items: center; justify-content: flex-end; gap: 8px; flex-wrap: wrap;
  }

  /* ---- Shell ---- */
  .shell { display: flex; height: calc(100% - 61px); }
  @media (max-width: 860px) { .shell { flex-direction: column; } }

  .sidebar {
    width: 340px; min-width: 180px; max-width: 600px; flex-shrink: 0;
    border-right: 1px solid var(--line); background: #FBFAF6;
    display: flex; flex-direction: column; min-height: 0; overflow: hidden;
  }
  .resize-handle {
    width: 5px; flex-shrink: 0; cursor: col-resize;
    background: transparent; border-right: 1px solid var(--line);
    transition: background .15s, border-color .15s;
  }
  .resize-handle:hover, .resize-handle.dragging {
    background: var(--accent-soft); border-color: var(--accent);
  }
  .side-block { padding: 18px 18px 14px; border-bottom: 1px solid var(--line); }
  .side-block .eyebrow {
    font-size: 11px; text-transform: uppercase; letter-spacing: .1em;
    color: var(--faint); margin-bottom: 8px; font-weight: 600;
  }
  select, input[type="text"] {
    width: 100%; font-family: inherit; font-size: 14px; color: var(--text);
    padding: 9px 11px; border: 1px solid var(--line-strong); border-radius: 8px;
    background: #fff;
  }
  select:focus, input:focus { outline: 2px solid var(--accent); outline-offset: 1px; border-color: var(--accent); }

  .paper-list-wrap { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  .paper-list-head { padding: 14px 18px 10px; }
  .paper-list-head .eyebrow { display:flex; justify-content:space-between; align-items:baseline; }
  .paper-list-head .count { color: var(--muted); font-weight: 500; letter-spacing: 0; text-transform: none; }
  .paper-list { flex: 1; overflow-y: auto; padding: 4px 10px 16px; }
  .paper-item {
    display: block; width: 100%; text-align: left; cursor: pointer;
    border: 1px solid transparent; border-radius: 8px; padding: 10px 12px;
    background: none; color: var(--text); line-height: 1.35; margin-bottom: 2px;
  }
  .paper-item:hover { background: #fff; border-color: var(--line); }
  .paper-item.active { background: #fff; border-color: var(--accent); box-shadow: var(--shadow); }
  .paper-item .pt { font-size: 13.5px; }
  .paper-item.active .pt { color: var(--accent); font-weight: 600; }
  .paper-item .pa { display:block; font-size: 11.5px; color: var(--faint);
    margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .paper-item .pid { display:block; font-family: var(--mono); font-size: 10.5px; color: var(--faint);
    margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .list-empty { padding: 24px 18px; color: var(--muted); font-size: 13.5px; }

  /* ---- Detail pane ---- */
  .detail { flex: 1; min-width: 0; overflow-y: auto; min-height: 0; padding: 30px 40px 60px; }
  @media (max-width: 860px) { .detail { padding: 22px 20px 50px; } }

  /* Landing: pipeline flow */
  .landing-head { max-width: 760px; margin-bottom: 30px; }
  .landing-head h2 { font-size: 27px; line-height: 1.15; margin-bottom: 10px; }
  .landing-head p { color: var(--muted); font-size: 15px; margin: 0; max-width: 620px; }

  .stat-row { display: flex; flex-wrap: wrap; gap: 14px; margin: 26px 0 8px; }
  .stat {
    background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 14px 18px; min-width: 130px; box-shadow: var(--shadow);
  }
  .stat .num { font-family: var(--serif); font-size: 28px; color: var(--accent); line-height: 1; }
  .stat .cap { font-size: 12px; color: var(--muted); margin-top: 6px;
    text-transform: uppercase; letter-spacing: .06em; }
  .badges { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-left: auto; align-self: center; }
  .badge {
    font-size: 12px; padding: 5px 11px; border-radius: 999px; font-weight: 600;
    border: 1px solid var(--line-strong); color: var(--muted); background: #fff;
  }
  .badge.on { background: var(--accent-2-soft); border-color: #E0CFA6; color: #7A5E22; }
  .badge.cohort {
    background: #E8F1EA; border-color: #BFD5C3; color: #2E5E39;
  }
  .explore { margin: 20px 0 4px; }
  .explore-title { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--faint); margin-bottom: 8px; }
  .explore-btns { display: flex; flex-wrap: wrap; gap: 10px; }
  .xbtn { text-decoration: none; font-size: 13.5px; font-weight: 600; color: var(--accent);
    background: var(--accent-soft); border: 1px solid #C9D6E8; border-radius: 8px; padding: 9px 14px; }
  .xbtn:hover { background: #DCE6F3; }
  .xbtn.disabled { color: var(--faint); background: #F2F0EA; border-color: var(--line); cursor: default; font-weight: 500; }
  .badge.off { opacity: .7; }

  .flow-title {
    font-size: 12px; text-transform: uppercase; letter-spacing: .1em; color: var(--faint);
    font-weight: 600; margin: 40px 0 16px;
  }
  .flow { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0; position: relative; }
  @media (max-width: 720px) { .flow { grid-template-columns: 1fr; } }
  .flow-node {
    background: var(--panel); border: 1px solid var(--line); box-shadow: var(--shadow);
    padding: 18px 18px 20px; position: relative; z-index: 1;
  }
  .flow-node:not(:last-child) { border-right: none; }
  .flow-node:nth-child(1) { z-index: 4; }
  .flow-node:nth-child(2) { z-index: 3; }
  .flow-node:nth-child(3) { z-index: 2; }
  .flow-node:nth-child(4) { z-index: 1; }
  @media (max-width: 720px) { .flow-node { border-right: 1px solid var(--line) !important; } }
  .flow-node:first-child { border-radius: var(--radius) 0 0 var(--radius); }
  .flow-node:last-child { border-radius: 0 var(--radius) var(--radius) 0; }
  @media (max-width: 720px) { .flow-node:first-child,.flow-node:last-child { border-radius: var(--radius); } }
  .flow-node .step {
    display: inline-flex; align-items: center; justify-content: center;
    width: 26px; height: 26px; border-radius: 50%;
    background: var(--chrome); color: var(--accent-2);
    font-family: var(--mono); font-size: 12px; font-weight: 600; margin-bottom: 12px;
  }
  .flow-node h4 { font-size: 15.5px; margin-bottom: 6px; }
  .flow-node p { margin: 0; font-size: 12.5px; color: var(--muted); line-height: 1.45; }
  .flow-arrow {
    position: absolute; top: 50%; right: -8px; transform: translateY(-50%);
    width: 16px; height: 16px; z-index: 2;
    background: var(--accent-2); border-radius: 50%;
    display: grid; place-items: center; color: #fff; font-size: 10px;
  }
  @media (max-width: 720px) { .flow-arrow { display: none; } }

  .hint { color: var(--faint); font-size: 13px; margin-top: 34px; font-style: italic;
    border-top: 1px solid var(--line); padding-top: 18px; }

  /* Paper detail */
  .paper-head { border-bottom: 1px solid var(--line); padding-bottom: 20px; margin-bottom: 20px; }
  .paper-head h2 { font-size: 24px; line-height: 1.2; max-width: 820px; }
  .paper-authors { font-size: 13px; color: var(--faint); margin-top: 6px; }
  .paper-head .nid { font-family: var(--mono); font-size: 11px; color: var(--faint);
    margin-top: 8px; word-break: break-all; }
  .backlink {
    background: none; border: none; color: var(--accent); cursor: pointer; padding: 0;
    font-size: 13px; margin-bottom: 14px; display: inline-flex; gap: 6px; align-items: center;
  }
  .backlink:hover { text-decoration: underline; }

  .tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line-strong); margin-bottom: 24px; flex-wrap: wrap; }
  .tab {
    background: none; border: none; cursor: pointer; padding: 10px 16px;
    font-size: 13.5px; color: var(--muted); border-bottom: 2px solid transparent;
    margin-bottom: -1px; font-weight: 500;
  }
  .tab:hover { color: var(--text); }
  .tab[aria-selected="true"] { color: var(--accent); border-bottom-color: var(--accent); font-weight: 600; }
  .tab .tcount { color: var(--faint); font-weight: 500; }
  .tab[aria-selected="true"] .tcount { color: var(--accent); }

  .card {
    background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 18px 20px; margin-bottom: 14px; box-shadow: var(--shadow);
  }
  .card .q { font-family: var(--serif); font-size: 16.5px; line-height: 1.35; margin-bottom: 10px; }
  .card .q::before { content: "Q"; font-family: var(--mono); font-size: 11px; color: var(--accent-2);
    background: var(--accent-2-soft); border-radius: 5px; padding: 2px 6px; margin-right: 9px; vertical-align: 2px; }
  .card .a { font-size: 14.5px; color: var(--text); padding-left: 4px;
    border-left: 3px solid var(--accent-soft); padding: 2px 0 2px 14px; }

  .title-with-badge {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  }
  .cohort-badge {
    display: inline-flex; align-items: center;
    font-family: var(--mono); font-size: 11px; font-weight: 700; letter-spacing: .04em;
    text-transform: uppercase; padding: 3px 9px; border-radius: 999px;
    background: #E8F1EA; color: #2E5E39; border: 1px solid #BFD5C3;
    vertical-align: middle;
  }
  .cohort-badge.chrome {
    background: rgba(232,241,234,.1); color: #D8EFDE; border-color: #5E7A65;
  }
  .card .a.empty { color: var(--faint); font-style: italic; border-left-color: var(--line); }

  details.abstract {
    background: #FBFAF6; border: 1px solid var(--line); border-radius: var(--radius);
    padding: 4px 18px; margin-bottom: 22px;
  }
  details.abstract summary {
    cursor: pointer; padding: 12px 0; font-weight: 600; font-size: 13px;
    color: var(--muted); list-style: none; display: flex; align-items: center; gap: 8px;
  }
  details.abstract summary::-webkit-details-marker { display: none; }
  details.abstract summary .chev { color: var(--accent-2); transition: transform .15s; }
  details.abstract[open] summary .chev { transform: rotate(90deg); }
  details.abstract .body { padding: 0 0 16px; font-size: 14.5px; color: #3A414F; line-height: 1.6; }

  .chips { display: flex; flex-wrap: wrap; gap: 9px; }
  .chip {
    background: var(--accent-soft); color: var(--accent); border: 1px solid #D5E0EF;
    border-radius: 999px; padding: 7px 14px; font-size: 13px; line-height: 1.3;
  }

  .partner-title { font-family: var(--serif); font-size: 16px; margin-bottom: 4px; }
  .partner-id { font-family: var(--mono); font-size: 10.5px; color: var(--faint);
    margin-bottom: 12px; word-break: break-all; }
  .topic { margin: 0 0 12px; padding-left: 16px; position: relative; }
  .topic::before { content: ""; position: absolute; left: 0; top: 8px; width: 6px; height: 6px;
    border-radius: 50%; background: var(--accent-2); }
  .topic .tname { font-weight: 600; }
  .topic .tjust { display: block; color: var(--muted); font-size: 13.5px; line-height: 1.55; margin-top: 3px; }
  .ab-legend { display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
    font-size: 12px; margin: 0 0 8px; }
  .ab-legend .ab-mine { background: var(--accent-soft); color: var(--accent);
    border: 1px solid #C9D6E8; border-radius: 6px; padding: 2px 8px; font-weight: 600; }
  .ab-legend .ab-theirs { background: var(--accent-2-soft); color: #7A5E22;
    border: 1px solid #E0CFA6; border-radius: 6px; padding: 2px 8px; }
  .ab-legend .ab-sep { color: var(--faint); }
  .topic-count { font-size: 11.5px; text-transform: uppercase; letter-spacing: .04em;
    color: var(--faint); margin: 0 0 10px; }

  /* Compared-to: search + sortable expandable table */
  .cmp-controls { display: flex; gap: 10px; margin: 0 0 14px; }
  .cmp-search { flex: 1; padding: 9px 12px; border: 1px solid var(--line-strong); border-radius: 8px;
    font-size: 14px; font-family: var(--sans); background: #fff; }
  .cmp-search:focus { outline: 2px solid var(--accent); outline-offset: 1px; border-color: var(--accent); }
  .cmp-sort { padding: 9px 10px; border: 1px solid var(--line-strong); border-radius: 8px; background: #fff;
    font-size: 13px; color: var(--text); }
  .dupnote { color: var(--accent-2); }
  .cmp-row { border: 1px solid var(--line); border-radius: 9px; margin-bottom: 8px; background: #fff;
    overflow: hidden; }
  .cmp-row.open { border-color: var(--line-strong); box-shadow: var(--shadow); }
  .cmp-head { width: 100%; display: flex; align-items: center; gap: 10px; padding: 11px 14px;
    background: none; border: 0; cursor: pointer; text-align: left; font: inherit; color: inherit; }
  .cmp-head:hover { background: #FBFAF6; }
  .cmp-head .chev { color: var(--accent-2); transition: transform .15s; flex: none; }
  .cmp-row.open .cmp-head .chev { transform: rotate(90deg); }
  .cmp-title { font-family: var(--serif); font-size: 15px; flex: 1; min-width: 0;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cmp-meta { display: flex; gap: 6px; align-items: center; flex: none; }
  .topic-badge { font-size: 11px; color: var(--accent); background: var(--accent-soft);
    border: 1px solid #C9D6E8; border-radius: 20px; padding: 2px 9px; white-space: nowrap; }
  .runs-badge { font-size: 11px; color: #7A5E22; background: var(--accent-2-soft);
    border: 1px solid #E0CFA6; border-radius: 20px; padding: 2px 9px; white-space: nowrap; font-weight: 600; }
  .cmp-preview { padding: 0 14px 11px 34px; color: var(--faint); font-size: 13px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cmp-detail { padding: 4px 16px 14px 34px; border-top: 1px solid var(--line); }
  .cmp-detail .topic:first-child { margin-top: 12px; }

  .note {
    background: var(--accent-2-soft); border: 1px solid #E7D9B8; border-radius: var(--radius);
    padding: 16px 18px; color: #6E551C; font-size: 14px;
  }

  /* consolidated table */
  .tablewrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--radius);
    box-shadow: var(--shadow); background: #fff; }
  table.debates { border-collapse: collapse; width: 100%; min-width: 640px; font-size: 14px; }
  table.debates th, table.debates td { text-align: left; padding: 13px 16px; border-bottom: 1px solid var(--line); vertical-align: top; }
  table.debates thead th {
    background: #FBFAF6; font-family: var(--sans); font-size: 11px; text-transform: uppercase;
    letter-spacing: .06em; color: var(--muted); font-weight: 600; position: sticky; top: 0;
    border-bottom: 1px solid var(--line-strong); white-space: nowrap;
  }
  table.debates th.sortable { cursor: pointer; user-select: none; }
  table.debates th.sortable:hover { color: var(--accent); }
  table.debates th .arr { color: var(--accent-2); font-size: 10px; }
  table.debates tbody tr:last-child td { border-bottom: none; }
  table.debates tbody tr:hover { background: #FBFAF6; }
  table.debates .tname { font-family: var(--serif); font-size: 15px; }
  table.debates .tdef { color: var(--muted); max-width: 460px; }
  .freq-badge { display: inline-block; background: var(--accent-soft); color: var(--accent);
    border: 1px solid #D5E0EF; border-radius: 6px; padding: 2px 9px; font-family: var(--mono);
    font-size: 12px; white-space: nowrap; }
  .nmem { font-family: var(--mono); color: var(--muted); }
  .def-toggle { background: none; border: none; color: var(--accent); cursor: pointer;
    padding: 0; font-size: 12.5px; margin-left: 6px; }
  .def-toggle:hover { text-decoration: underline; }
  .tab-caption { font-size: 12.5px; color: var(--faint); margin: -10px 0 18px; }

  .empty-state { color: var(--muted); padding: 20px 0; font-size: 14.5px; }
  .center-load { display: grid; place-items: center; height: 100%; color: var(--muted); }
  .spinner { width: 26px; height: 26px; border: 3px solid var(--line); border-top-color: var(--accent);
    border-radius: 50%; animation: spin .8s linear infinite; margin-bottom: 12px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .spinner { animation: none; } }
  .visually-hidden { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); }
</style>

<header class="topbar">
  <span class="mark">Pipeline Explorer<span class="dot">.</span></span>
  <span class="tagline">Debates in legal scholarship, from abstract to consensus</span>
  <a class="proto-link" href="./pages/deduped_themes.html" title="Browse theme sets across the available communities">Theme Browser ↗</a>
  <div class="cur" id="curCommunity" hidden>
    <div class="lbl">Community</div>
    <div class="val" id="curCommunityVal"></div>
  </div>
</header>

<div class="shell">
  <aside class="sidebar">
    <div class="side-block">
      <div class="eyebrow">Community</div>
      <select id="communitySelect" aria-label="Select a community"></select>
    </div>
    <div class="paper-list-wrap">
      <div class="paper-list-head">
        <div class="eyebrow"><span>Papers</span><span class="count" id="paperCount"></span></div>
        <input type="text" id="paperFilter" placeholder="Filter by title or author…" aria-label="Filter papers by title or author" autocomplete="off">
      </div>
      <div class="paper-list" id="paperList"></div>
    </div>
  </aside>
  <div class="resize-handle" id="sidebarResizer"></div>

  <main class="detail" id="detail">
    <div class="center-load"><div class="spinner" aria-hidden="true"></div><div>Loading pipeline…</div></div>
  </main>
</div>

<script>
"use strict";

/* ============================================================
   Data loading — static vs server
   - Static: window.PIPELINE_DATA present -> use in-memory.
   - Server: fetch ./data/manifest.json, lazy ./data/<id>.json.
   A tiny dev sample is injected ONLY if neither real source exists.
   ============================================================ */

const state = {
  manifest: null,        // { communities: [...] }
  pageIndex: null,       // { communities: [...] } for standalone theme-browser pages
  communities: {},       // id -> communityObj (cache)
  staticData: null,      // window.PIPELINE_DATA or null
  currentCommunityId: null,
  currentCommunity: null,
  currentPaperId: null,  // null = landing
  activeTab: 0,
  filter: "",
  debateSort: { key: "frequency", dir: "desc" },
  defExpanded: {},       // theme index -> bool
  cmpSearch: "",         // Compared-to search query
  cmpSort: "topics_desc",// Compared-to sort key
  cmpExpanded: {},       // partner id -> bool (expanded row)
  _cmp: null,            // prepared+merged partner list for the current paper
  _cmpPaperId: null,     // node_id the _cmp cache was built for
};

const TABS = ["Themes matched", "Compared to", "Community debates"];

/* ---------- source resolution ---------- */

async function resolveSource() {
  state.pageIndex = await loadPageIndex();
  if (window.PIPELINE_DATA && window.PIPELINE_DATA.manifest) {
    state.staticData = window.PIPELINE_DATA;
    state.manifest = mergeManifests(window.PIPELINE_DATA.manifest, state.pageIndex);
    return "static";
  }
  // Try server manifest.
  try {
    const res = await fetch("./data/manifest.json", { cache: "no-cache" });
    if (res.ok) {
      state.manifest = mergeManifests(await res.json(), state.pageIndex);
      return "server";
    }
  } catch (e) { /* fall through */ }
  return null; // no real data
}

async function loadCommunity(id) {
  if (state.communities[id]) return state.communities[id];
  if (state.staticData) {
    const obj = state.staticData.communities && state.staticData.communities[id];
    if (obj) { state.communities[id] = obj; return obj; }
    const synthetic = await loadThemeOnlyCommunity(id);
    if (synthetic) { state.communities[id] = synthetic; return synthetic; }
    throw new Error("Community not found in static data: " + id);
  }
  const res = await fetch("./data/" + encodeURIComponent(id) + ".json", { cache: "no-cache" });
  if (!res.ok) {
    const synthetic = await loadThemeOnlyCommunity(id);
    if (synthetic) { state.communities[id] = synthetic; return synthetic; }
    throw new Error("Could not load " + id + " (" + res.status + ")");
  }
  const obj = await res.json();
  state.communities[id] = obj;
  return obj;
}

/* ---------- helpers ---------- */

const esc = (s) => String(s == null ? "" : s)
  .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
  .replace(/"/g, "&quot;");

function communityNum(id) {
  const m = String(id || "").match(/(\d+)$/);
  return m ? Number(m[1]) : Number.MAX_SAFE_INTEGER;
}

function communityBaseLabel(meta) {
  const explorerLabel = String((meta && meta.explorer_label) || "").trim();
  if (explorerLabel) return explorerLabel;
  const id = String((meta && meta.id) || "").trim();
  const label = String((meta && meta.label) || "").trim();
  const fromId = id.match(/^community_(\d+)$/);
  if (fromId) return `Community ${fromId[1]}`;
  const fromLabel = label.match(/^community_(\d+)\b/i);
  if (fromLabel) return `Community ${fromLabel[1]}`;
  return label || id;
}

function communitySelectLabel(meta) {
  const base = communityBaseLabel(meta);
  const nPapers = Number((meta && meta.n_papers) || 0);
  return nPapers ? `${base} — ${nPapers.toLocaleString()} papers` : base;
}

function cohortBadgeHtml(meta, extraClass = "") {
  if (!(meta && meta.is_full_scale_1pct)) return "";
  return `<span class="cohort-badge${extraClass ? " " + extraClass : ""}">Full-scale 1%</span>`;
}

function themeBrowserButtonLabel(kind, count) {
  const n = Number(count || 0);
  return n ? `Show ${n.toLocaleString()} ${kind} + similarity →` : `Show ${kind} + similarity →`;
}

async function loadPageIndex() {
  try {
    const res = await fetch("./data/pages/community_index.json", { cache: "no-cache" });
    if (!res.ok) return { communities: [] };
    return res.json();
  } catch (_) {
    return { communities: [] };
  }
}

function mergeManifests(baseManifest, pageIndex) {
  const merged = { communities: [] };
  const byId = new Map();
  ((baseManifest && baseManifest.communities) || []).forEach(c => {
    byId.set(c.id, { ...c });
  });
  ((pageIndex && pageIndex.communities) || []).forEach(c => {
    const existing = byId.get(c.id);
    if (existing) {
      if (!existing.label && c.explorer_label) existing.label = c.explorer_label;
      if (!existing.n_papers && c.n_papers) existing.n_papers = c.n_papers;
      if (!existing.has_deduped && c.has_deduped_themes) existing.has_deduped = true;
    if (!existing.n_raw_themes && c.n_raw_themes) existing.n_raw_themes = c.n_raw_themes;
    if (!existing.n_deduped_themes && c.n_deduped_themes) existing.n_deduped_themes = c.n_deduped_themes;
    if (!existing.n_deduped_themes_pass2 && c.n_deduped_themes_pass2) existing.n_deduped_themes_pass2 = c.n_deduped_themes_pass2;
      if (!existing.is_full_scale_1pct && c.is_full_scale_1pct) existing.is_full_scale_1pct = true;
      return;
    }
    byId.set(c.id, {
      id: c.id,
      label: c.explorer_label || c.label || c.id,
      n_papers: c.n_papers || 0,
      n_raw_themes: c.n_raw_themes || 0,
      n_deduped_themes: c.n_deduped_themes || 0,
      n_deduped_themes_pass2: c.n_deduped_themes_pass2 || 0,
      has_themes: false,
      has_answers: false,
      has_questions: false,
      has_deduped: !!c.has_deduped_themes,
      theme_only: true,
      in_explorer: true,
      is_full_scale_1pct: !!c.is_full_scale_1pct,
    });
  });
  merged.communities = [...byId.values()].sort((a, b) => communityNum(a.id) - communityNum(b.id));
  return merged;
}

async function loadThemeOnlyCommunity(id) {
  const meta = ((state.pageIndex && state.pageIndex.communities) || []).find(c => c.id === id);
  if (!meta || !meta.has_deduped_themes) return null;
  try {
    const [themesRes, papersRes] = await Promise.all([
      fetch("./data/pages/" + encodeURIComponent(id) + "_deduped_themes.json", { cache: "no-cache" }),
      fetch("./data/pages/" + encodeURIComponent(id) + "_papers.json", { cache: "no-cache" }).catch(() => null),
    ]);
    if (!themesRes.ok) return null;
    const data = await themesRes.json();
    const paperData = papersRes && papersRes.ok ? await papersRes.json() : null;
    const papers = ((paperData && paperData.papers) || []).map(p => ({
      node_id: p.node_id || "",
      title: p.title || p.node_id || "",
      authors: p.authors || "",
      date: p.date || "",
      abstract: p.abstract || "",
      questions: Array.isArray(p.questions) ? p.questions : [],
      matched_themes: Array.isArray(p.matched_themes) ? p.matched_themes : [],
      compared_to: Array.isArray(p.compared_to) ? p.compared_to : [],
    }));
    return {
      id,
      label: meta.explorer_label || meta.label || data.label || id,
      n_papers: meta.n_papers || 0,
      theme_only: true,
      has_themes: false,
      has_answers: false,
      has_deduped: true,
      consolidated_themes: (data.themes || []).map(t => ({
        name: t.name || "",
        definition: t.definition || "",
        frequency: Number(t.frequency) || 0,
        n_members: Number(t.n_members) || 0,
      })),
      papers,
    };
  } catch (_) {
    return null;
  }
}

function cleanTitle(paper) {
  if (paper && paper.title && String(paper.title).trim()) return String(paper.title).trim();
  // node_id can be "id!!Some Title" — recover a title if possible.
  const nid = paper && paper.node_id ? String(paper.node_id) : "";
  if (nid.includes("!!")) {
    const tail = nid.split("!!").slice(1).join("!!").trim();
    if (tail) return tail;
  }
  return nid || "Untitled paper";
}
function shortId(nid) {
  if (!nid) return "";
  const s = String(nid);
  return s.length > 64 ? s.slice(0, 61) + "…" : s;
}
const truncate = (s, n) => { s = String(s || ""); return s.length > n ? s.slice(0, n - 1).trimEnd() + "…" : s; };

}

/* ----- Compared-to: merge duplicate partners, normalize A/B, search/sort/expand ----- */
function normTopic(t) { return String(t || "").toLowerCase().replace(/[^a-z0-9]+/g, " ").trim(); }

// Rewrite "Paper A"/"Paper B" to this-paper / the-other-paper using the run's focal_role,
// so a merged partner (possibly compared in both A and B orderings) reads unambiguously.
function normJust(j, role) {
  j = String(j || "");
  if (role === "A") return j.replace(/\bPaper A\b/g, "this paper").replace(/\bPaper B\b/g, "the other paper");
  if (role === "B") return j.replace(/\bPaper B\b/g, "this paper").replace(/\bPaper A\b/g, "the other paper");
  return j;
}

// Group compared_to by partner; each partner may appear across multiple comparison runs.
function prepCompared(compared) {
  const byId = new Map();
  (compared || []).forEach(e => {
    const id = e.partner_node_id || e.partner_title || "";
    let m = byId.get(id);
    if (!m) { m = { id, title: e.partner_title || "", runs: 0, topics: [], _seen: new Set() }; byId.set(id, m); }
    m.runs += 1;
    (e.shared_topics || []).forEach(t => {
      const k = normTopic(t.topic);
      if (k && m._seen.has(k)) return;          // drop exact-duplicate topic phrases across runs
      if (k) m._seen.add(k);
      m.topics.push({ topic: String(t.topic || ""), justification: normJust(t.justification, e.focal_role) });
    });
  });
  return [...byId.values()];
}

function filterSortCompared(list) {
  const q = state.cmpSearch.trim().toLowerCase();
  let out = q ? list.filter(m =>
    m.title.toLowerCase().includes(q) ||
    m.topics.some(t => t.topic.toLowerCase().includes(q) || t.justification.toLowerCase().includes(q))) : list;
  const s = state.cmpSort;
  return out.slice().sort((a, b) =>
    s === "title_asc" ? a.title.localeCompare(b.title) :
    s === "title_desc" ? b.title.localeCompare(a.title) :
    s === "topics_asc" ? a.topics.length - b.topics.length :
    b.topics.length - a.topics.length);
}

function cmpRowsHtml(list) {
  if (!list.length) return `<div class="empty-state">No partners match your search.</div>`;
  return list.map((m, i) => {
    const open = !!state.cmpExpanded[m.id];
    const name = cleanTitle({ title: m.title, node_id: m.id });
    const runsBadge = m.runs > 1 ? `<span class="runs-badge" title="This pairing was compared ${m.runs} times across pairwise runs">${m.runs} runs</span>` : "";
    const topicBadge = `<span class="topic-badge">${m.topics.length} topic${m.topics.length === 1 ? "" : "s"}</span>`;
    const detail = open ? `<div class="cmp-detail">${
      m.topics.length
        ? m.topics.map(t => `<div class="topic"><span class="tname">${esc(t.topic)}</span>${t.justification ? `<div class="tjust">${esc(t.justification)}</div>` : ""}</div>`).join("")
        : `<div class="empty-state" style="padding:0">No shared topics recorded.</div>`
    }</div>` : `<div class="cmp-preview">${esc(m.topics.length ? truncate(m.topics[0].topic, 100) : "no shared topics recorded")}</div>`;
    return `<div class="cmp-row${open ? " open" : ""}" data-cmp="${i}">
      <button class="cmp-head" aria-expanded="${open}">
        <span class="chev">›</span>
        <span class="cmp-title">${esc(name)}</span>
        <span class="cmp-meta">${topicBadge}${runsBadge}</span>
      </button>
      ${detail}
    </div>`;
  }).join("");
}

function updateCmpRows() {
  const c = document.getElementById("cmpRows");
  if (c) c.innerHTML = cmpRowsHtml(filterSortCompared(state._cmp || []));
}

function renderCompared(compared, paper) {
  if (!compared || !compared.length) return `<div class="empty-state">No recorded comparisons for this paper.</div>`;
  const pid = paper ? (paper.node_id || "") : "";
  if (state._cmpPaperId !== pid) {          // new paper -> rebuild + reset search/expansion
    state._cmpPaperId = pid;
    state._cmp = prepCompared(compared);
    state.cmpSearch = "";
    state.cmpExpanded = {};
  }
  const merged = state._cmp;
  const nDup = merged.filter(m => m.runs > 1).length;
  const runsNote = nDup ? ` <span class="dupnote">${nDup} pairing${nDup === 1 ? " was" : "s were"} compared more than once — badged “N&nbsp;runs”.</span>` : "";
  const caption = `<p class="tab-caption">Compared against <b>${merged.length}</b> paper${merged.length === 1 ? "" : "s"}. Search titles or shared-topic text; click a row to expand. "Paper&nbsp;A/B" in each justification is rewritten to <b>this paper</b> / <b>the other paper</b>.${runsNote}</p>`;
  const controls = `<div class="cmp-controls">
    <input type="search" id="cmpSearch" class="cmp-search" placeholder="Search partners or shared topics…" value="${esc(state.cmpSearch)}" autocomplete="off">
    <select id="cmpSort" class="cmp-sort" aria-label="Sort partners">
      <option value="topics_desc"${state.cmpSort === "topics_desc" ? " selected" : ""}>Most shared topics</option>
      <option value="topics_asc"${state.cmpSort === "topics_asc" ? " selected" : ""}>Fewest shared topics</option>
      <option value="title_asc"${state.cmpSort === "title_asc" ? " selected" : ""}>Title A–Z</option>
      <option value="title_desc"${state.cmpSort === "title_desc" ? " selected" : ""}>Title Z–A</option>
    </select>
  </div>`;
  return caption + controls + `<div id="cmpRows">${cmpRowsHtml(filterSortCompared(merged))}</div>`;
}

function renderDebates(debates) {
  if (!debates.length) return `<p class="tab-caption">Community-level view.</p><div class="empty-state">No consolidated debates for this community.</div>`;
  const { key, dir } = state.debateSort;
  const rows = debates.map((t, i) => ({ t, i })).sort((a, b) => {
    let av, bv;
    if (key === "name") { av = (a.t.name || "").toLowerCase(); bv = (b.t.name || "").toLowerCase();
      return dir === "asc" ? av.localeCompare(bv) : bv.localeCompare(av); }
    av = Number(a.t[key]) || 0; bv = Number(b.t[key]) || 0;
    return dir === "asc" ? av - bv : bv - av;
  });
  const arrow = (k) => key === k ? `<span class="arr">${dir === "asc" ? "▲" : "▼"}</span>` : "";
  const body = rows.map(({ t, i }) => {
    const def = String(t.definition || "");
    const expanded = state.defExpanded[i];
    const long = def.length > 150;
    const shownDef = (!long || expanded) ? esc(def) : esc(truncate(def, 150));
    const toggle = long ? `<button class="def-toggle" data-def="${i}">${expanded ? "less" : "more"}</button>` : "";
    return `<tr>
      <td class="tname">${esc(t.name || "—")}</td>
      <td class="tdef">${shownDef || '<span style="color:var(--faint)">—</span>'}${toggle}</td>
      <td><span class="freq-badge">freq ${Number(t.frequency) || 0}</span></td>
      <td class="nmem">${t.n_members != null ? esc(t.n_members) : "—"}</td>
    </tr>`;
  }).join("");
  return `
    <p class="tab-caption">Community debates — the same across every paper in this cluster.</p>
    <div class="tablewrap"><table class="debates">
      <thead><tr>
        <th class="sortable" data-sort="name">Theme ${arrow("name")}</th>
        <th>Definition</th>
        <th class="sortable" data-sort="frequency">Frequency ${arrow("frequency")}</th>
        <th class="sortable" data-sort="n_members">Members ${arrow("n_members")}</th>
      </tr></thead>
      <tbody>${body}</tbody>
    </table></div>`;
}

/* ---------- wiring ---------- */

function wirePaper(c, paper) {
  const el = document.getElementById("detail");
  const back = el.querySelector("#backBtn");
  if (back) back.onclick = () => { state.currentPaperId = null; render(); };
  el.querySelectorAll(".tab").forEach(t => {
    t.onclick = () => { state.activeTab = Number(t.getAttribute("data-tab")); renderDetail(); };
  });
  const absDet = el.querySelector("details.abstract");
  if (absDet) absDet.addEventListener("toggle", () => { state._absOpen = absDet.open; });
  el.querySelectorAll("th.sortable").forEach(th => {
    th.onclick = () => {
      const k = th.getAttribute("data-sort");
      if (state.debateSort.key === k) state.debateSort.dir = state.debateSort.dir === "asc" ? "desc" : "asc";
      else state.debateSort = { key: k, dir: k === "name" ? "asc" : "desc" };
      renderDetail();
    };
  });
  el.querySelectorAll(".def-toggle").forEach(b => {
    b.onclick = () => { const i = b.getAttribute("data-def"); state.defExpanded[i] = !state.defExpanded[i]; renderDetail(); };
  });
  // Compared-to: search / sort / expand. Only #cmpRows is re-rendered so the search
  // box keeps focus while typing.
  const cmpSearch = el.querySelector("#cmpSearch");
  if (cmpSearch) cmpSearch.addEventListener("input", () => { state.cmpSearch = cmpSearch.value; updateCmpRows(); });
  const cmpSort = el.querySelector("#cmpSort");
  if (cmpSort) cmpSort.addEventListener("change", () => { state.cmpSort = cmpSort.value; updateCmpRows(); });
  const cmpRows = el.querySelector("#cmpRows");
  if (cmpRows) cmpRows.addEventListener("click", (ev) => {
    const head = ev.target.closest(".cmp-head");
    if (!head) return;
    const idx = Number(head.closest(".cmp-row").getAttribute("data-cmp"));
    const m = filterSortCompared(state._cmp || [])[idx];
    if (!m) return;
    state.cmpExpanded[m.id] = !state.cmpExpanded[m.id];
    updateCmpRows();
  });
}

/* ---------- selection flow ---------- */

async function selectCommunity(id) {
  state.currentCommunityId = id;
  state.currentPaperId = null;
  state.activeTab = 0;
  state.filter = "";
  state.defExpanded = {};
  state._absOpen = false;
  state.cmpSearch = ""; state.cmpExpanded = {}; state._cmp = null; state._cmpPaperId = null;
  document.getElementById("communitySelect").value = id;
  const fbox = document.getElementById("paperFilter");
  if (fbox) fbox.value = "";
  document.getElementById("detail").innerHTML =
    `<div class="center-load"><div class="spinner" aria-hidden="true"></div><div>Loading community…</div></div>`;
  try {
    state.currentCommunity = await loadCommunity(id);
  } catch (e) {
    state.currentCommunity = null;
    document.getElementById("detail").innerHTML =
      `<div class="note" style="background:#F7E9E9;border-color:#E3C3C3;color:var(--danger)">
        Could not load this community.<br><span style="font-size:12px">${esc(e.message)}</span></div>`;
    renderTopbar(); renderPaperList(); return;
  }
  render();
}

function selectPaper(id) {
  state.currentPaperId = id;
  state.activeTab = 0;
  state._absOpen = false;
  render();
}

function render() { renderTopbar(); renderPaperList(); renderDetail(); }

/* ---------- boot ---------- */

async function init() {
  const src = await resolveSource();
  if (!src) {
    injectDevSample();
    state.staticData = window.PIPELINE_DATA;
    state.manifest = mergeManifests(window.PIPELINE_DATA.manifest, state.pageIndex);
  }
  const comms = (state.manifest.communities || []);
  if (!comms.length) {
    document.getElementById("detail").innerHTML =
      `<div class="empty-state">No communities found. Add <code>./data/manifest.json</code> or define <code>window.PIPELINE_DATA</code>.</div>`;
    return;
  }
  renderCommunitySelect();
  document.getElementById("paperFilter").addEventListener("input", (e) => {
    state.filter = e.target.value; renderPaperList();
  });

  // Read navigation params from sessionStorage (survives page nav without touching the URL,
  // so the Workbench SSO proxy can't strip or rewrite them).
  let startId = comms[0].id;
  let startQ = "";
  let fromAuthorBrowse = false;
  try {
    const raw = sessionStorage.getItem("asd_nav");
    if (raw) {
      sessionStorage.removeItem("asd_nav");
      const nav = JSON.parse(raw);
      if (nav.community && comms.find(c => c.id === nav.community)) startId = nav.community;
      if (nav.q) startQ = nav.q;
      if (nav.from === "author_browse") fromAuthorBrowse = true;
    }
  } catch (_) {}

  await selectCommunity(startId);

  if (startQ) {
    state.filter = startQ;
    const fbox = document.getElementById("paperFilter");
    if (fbox) fbox.value = startQ;
    renderPaperList();
  }

  if (fromAuthorBrowse) {
    const a = document.createElement("a");
    a.className = "proto-link";
    a.textContent = "← Author Browse";
    a.href = "./prototypes/author_browse.html";
    document.querySelector(".topbar").insertBefore(a, document.querySelector(".topbar .proto-link"));
  }

  renderCommunitySelect(); // ensure select reflects loaded community
}

(function() {
  const handle = document.getElementById("sidebarResizer");
  const sidebar = document.querySelector(".sidebar");
  if (!handle || !sidebar) return;
  let startX, startW;
  handle.addEventListener("mousedown", e => {
    startX = e.clientX; startW = sidebar.offsetWidth;
    handle.classList.add("dragging");
    document.body.style.cursor = "col-resize";
    document.body.style.userSelect = "none";
  });
  document.addEventListener("mousemove", e => {
    if (!handle.classList.contains("dragging")) return;
    sidebar.style.width = Math.min(600, Math.max(180, startW + e.clientX - startX)) + "px";
  });
  document.addEventListener("mouseup", () => {
    handle.classList.remove("dragging");
    document.body.style.cursor = "";
    document.body.style.userSelect = "";
  });
})();
